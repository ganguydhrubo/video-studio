[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-studio"
version = "1.7.0"
description = "Local-first AI video production studio for Windows: edit your footage or turn a script into a finished video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
# Heavy ML runs in the system Python through video_studio/helpers/ml_helper.py; install these there.
ml = ["faster-whisper>=1.0", "kokoro-onnx>=0.4", "noisereduce>=3", "soundfile", "scipy", "opencv-python", "mediapipe", "librosa"]

[project.scripts]
video-studio = "video_studio.cli:main"

[tool.setuptools.packages.find]
include = ["video_studio*"]

[tool.setuptools.package-data]
video_studio = ["blender/*.py", "helpers/*.py", "studio_ui/*.html", "studio_ui/*.js", "assets/*"]
