<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width={{W}}, height={{H}}">
{{HEAD}}
<style>
html, body { margin: 0; background: transparent; }
#root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: transparent; }
.clip { position: absolute; inset: 0; }
.lt { position: absolute; left: var(--pad); bottom: calc(var(--size) * .35); display: flex; align-items: stretch; gap: calc(var(--size) * .28); }
.bar { width: max(6px, calc(var(--size) * .12)); border-radius: 4px; background: var(--accent); transform-origin: bottom center; }
.plate { padding: calc(var(--size) * .22) calc(var(--size) * .5) calc(var(--size) * .26) calc(var(--size) * .4);
  background: var(--plate); border-radius: calc(var(--size) * .16); display: flex; flex-direction: column; justify-content: center;
  max-width: calc({{W}}px - var(--pad) * 2 - var(--size) * .6); box-sizing: border-box; }
.name { margin: 0; font-family: var(--font); font-weight: 800; font-size: var(--size); line-height: 1.05; color: var(--ink);
  white-space: nowrap; letter-spacing: var(--track); text-shadow: var(--shadow); }
.place { margin: calc(var(--size) * .1) 0 0; font-family: var(--font2); font-size: calc(var(--size) * .5); color: var(--muted);
  letter-spacing: .06em; white-space: nowrap; text-transform: uppercase; }
.place.empty { display: none; }
.neon .plate { background: rgba(6, 4, 20, .38); border: max(3px, calc(var(--size) * .05)) solid var(--glow);
  box-shadow: 0 0 14px var(--glow), 0 0 40px var(--glow2), inset 0 0 18px var(--glow2); }
.neon .bar { display: none; }
.neon .name { color: #fff; text-shadow: 0 0 6px var(--glow), 0 0 18px var(--glow), 0 0 40px var(--glow2); }
.neon .place { color: var(--glow); text-shadow: 0 0 10px var(--glow2); }
.elegant .plate { background: none; padding-left: 0; }
.elegant .name { font-weight: 400; font-style: italic; }
.elegant .bar { width: 2px; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}" data-fps="{{FPS}}">
  <section class="clip" id="scene" data-start="0" data-duration="{{DUR}}" data-track-index="0">
    <div class="lt" id="lt">
      <span class="bar" id="bar"></span>
      <div class="plate" id="plate">
        <p class="name" id="name" data-tb="name"></p>
        <p class="place" id="place" data-tb="place"></p>
      </div>
    </div>
  </section>
</div>
<script>
TB.fill();
document.getElementById("lt").classList.add(TB.style);
const D = {{DUR}};
const tl = gsap.timeline({ paused: true });
tl.from("#bar", { scaleY: 0, duration: 0.35, ease: "power3.out" }, 0);
tl.fromTo("#plate", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, 0.12);
tl.from("#name", { xPercent: -12, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.35);
tl.from("#place", { y: 14, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.55);
if (TB.style === "neon") {
  [[0.14, 0.2], [0.2, 1], [0.27, 0.35], [0.33, 1], [0.9, 0.7], [0.94, 1]].forEach(([t, o]) => tl.set("#plate", { opacity: o }, t));
}
tl.to("#name, #place", { opacity: 0, duration: 0.25, ease: "power1.in" }, D - 0.55);
tl.to("#plate", { clipPath: "inset(0% 0% 0% 100%)", duration: 0.4, ease: "power3.in" }, D - 0.45);
tl.to("#bar", { scaleY: 0, duration: 0.3, ease: "power2.in" }, D - 0.32);
window.__timelines["main"] = tl;
TB.whenReady(() => { TB.fit(document.getElementById("name"), {{W}} * 0.78); TB.fit(document.getElementById("place"), {{W}} * 0.78); });
</script>
</body></html>
