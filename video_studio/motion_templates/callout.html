<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width={{W}}, height={{H}}">
{{HEAD}}
<style>
html, body { margin: 0; background: transparent; }
#root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: transparent; }
.clip { position: absolute; inset: 0; }
.stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.word { position: relative; margin: 0; font-family: var(--font); font-weight: 800; font-size: var(--size); line-height: 1;
  color: var(--ink); text-transform: uppercase; letter-spacing: var(--track); white-space: nowrap; text-shadow: var(--shadow); }
.word .l { display: inline-block; }
.line { position: absolute; left: 6%; right: 6%; bottom: calc(var(--size) * -.22); height: max(6px, calc(var(--size) * .13));
  border-radius: 99px; background: var(--accent); transform-origin: left center; }
.ray { position: absolute; left: 50%; top: 50%; width: calc(var(--size) * .5); height: max(4px, calc(var(--size) * .07));
  margin-top: calc(var(--size) * -.035); border-radius: 99px; background: var(--accent); transform-origin: left center; }
.neon .word { color: #fff; text-shadow: 0 0 8px var(--glow), 0 0 22px var(--glow), 0 0 48px var(--glow2); }
.neon .line, .neon .ray { background: var(--glow); box-shadow: 0 0 16px var(--glow); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}" data-fps="{{FPS}}">
  <section class="clip" id="scene" data-start="0" data-duration="{{DUR}}" data-track-index="0">
    <div class="stage" id="stage">
      <div id="burst"></div>
      <p class="word" id="word"><span id="letters" data-tb="text" data-letters></span><span class="line" id="line"></span></p>
    </div>
  </section>
</div>
<script>
TB.fill();
document.getElementById("stage").classList.add(TB.style);
const D = {{DUR}};
const rnd = TB.rand(TB.seed || 7);
const burst = document.getElementById("burst");
const word = document.getElementById("word");
for (let i = 0; i < 8; i++) {   // rays drawn once; their angles come from the seeded generator
  const r = document.createElement("span");
  r.className = "ray"; r.id = "ray" + i;
  burst.append(r);
}
const tl = gsap.timeline({ paused: true });
const letters = document.querySelectorAll("#letters .l");
letters.forEach((el, i) => tl.from(el, { scale: 0, yPercent: 60, rotation: (rnd() - 0.5) * 40, opacity: 0, duration: 0.42,
  ease: "back.out(2.4)" }, 0.03 + i * 0.035));
tl.from("#line", { scaleX: 0, duration: 0.35, ease: "power3.out" }, 0.2);
document.querySelectorAll(".ray").forEach((el, i) => {
  const a = (i / 8) * 360 + rnd() * 20;
  const dist = {{W}} * (0.2 + rnd() * 0.08);
  tl.fromTo(el, { rotation: a, x: 0, y: 0, scaleX: 0, opacity: 1 },
    { x: Math.cos(a * Math.PI / 180) * dist, y: Math.sin(a * Math.PI / 180) * dist * 0.6, scaleX: 1, opacity: 0, duration: 0.55, ease: "power2.out" }, 0.12);
});
tl.to("#word", { scale: 1.06, duration: D - 0.7, ease: "none" }, 0.45);
tl.to("#word", { scale: 1.25, opacity: 0, duration: 0.22, ease: "power2.in" }, D - 0.25);
window.__timelines["main"] = tl;
TB.whenReady(() => TB.fit(word, {{W}} * 0.86, {{H}} * 0.8));
</script>
</body></html>
