<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width={{W}}, height={{H}}">
{{HEAD}}
<style>
html, body { margin: 0; background: transparent; }
#root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: transparent; }
.clip { position: absolute; inset: 0; }
canvas { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; }
.neon canvas { filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 28px var(--glow2)); }
.gold canvas, .clean canvas, .bold canvas, .elegant canvas { filter: drop-shadow(0 10px 16px rgba(0,0,0,.45)); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}" data-fps="{{FPS}}">
  <section class="clip" id="scene" data-start="0" data-duration="{{DUR}}" data-track-index="0">
    <canvas id="c3" width="{{W}}" height="{{H}}"></canvas>
  </section>
</div>
<script>
/* 3D title: real extruded letters (three.js TextGeometry from the bundled Mukta ExtraBold outlines, SIL OFL),
   flying in with a spin, a gentle sway (or a full turn when asked to spin) and a quick spin away at the end. */
const D = {{DUR}}, W = {{W}}, H = {{H}};
document.getElementById("scene").classList.add(TB.style);
const R = new THREE.WebGLRenderer({ canvas: document.getElementById("c3"), alpha: true, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1);
R.setSize(W, H, false);
R.setClearColor(0x000000, 0);
R.outputColorSpace = THREE.SRGBColorSpace;
R.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
cam.position.set(0, 0, 14);
const C = TB.colors;
const LOOK = {
  gold:    { face: "#ffd36b", side: "#a8711b", metal: 0.85, rough: 0.28, glow: null },
  neon:    { face: "#ffffff", side: C.glow2 || "#ff2bd6", metal: 0.1, rough: 0.35, glow: C.glow || "#22e6ff" },
  elegant: { face: "#fff7e8", side: "#c99a4b", metal: 0.6, rough: 0.3, glow: null },
  bold:    { face: "#ffffff", side: C.accent || "#ff4d2e", metal: 0.15, rough: 0.4, glow: null },
  clean:   { face: "#ffffff", side: C.accent || "#4cc9f0", metal: 0.2, rough: 0.38, glow: null },
}[TB.style] || { face: "#ffffff", side: C.accent || "#4cc9f0", metal: 0.2, rough: 0.38, glow: null };
const face = new THREE.MeshStandardMaterial({ color: LOOK.face, metalness: LOOK.metal, roughness: LOOK.rough });
const side = new THREE.MeshStandardMaterial({ color: LOOK.side, metalness: LOOK.metal, roughness: LOOK.rough + 0.1 });
if (LOOK.glow) { face.emissive = new THREE.Color(LOOK.glow); face.emissiveIntensity = 0.55; side.emissive = new THREE.Color(LOOK.side); side.emissiveIntensity = 0.5; }
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(3, 5, 8); scene.add(key);
const rim = new THREE.DirectionalLight(new THREE.Color(C.accent || "#88ccff"), 1.8); rim.position.set(-5, 2, -4); scene.add(rim);
const sweep = new THREE.PointLight(0xffffff, 60, 30); scene.add(sweep);

const font = new THREE.FontLoader().parse(window.TB_FONT);
const group = new THREE.Group();
scene.add(group);
const lines = TB.lines && TB.lines.length ? TB.lines : [TB.title || ""];
const size = 1, depth = 0.34, gap = 0.28;
const meshes = lines.map((text) => {
  const g = new THREE.TextGeometry(text, { font, size, depth, curveSegments: 7, bevelEnabled: true,
    bevelThickness: 0.05, bevelSize: 0.035, bevelSegments: 3 });
  g.computeBoundingBox();
  g.center();
  return new THREE.Mesh(g, [face, side]);
});
const totalH = lines.length * size + (lines.length - 1) * gap;
meshes.forEach((m, i) => { m.position.y = totalH / 2 - size / 2 - i * (size + gap); group.add(m); });
// fit: the widest line takes at most 86% of the view width, the block at most 70% of its height
const viewH = 2 * Math.tan((cam.fov * Math.PI / 180) / 2) * cam.position.z, viewW = viewH * (W / H);
const widest = Math.max(...meshes.map((m) => m.geometry.boundingBox.max.x - m.geometry.boundingBox.min.x));
const k = Math.min((viewW * 0.86) / widest, (viewH * 0.7) / totalH);
group.scale.setScalar(k);

const E = TB.ease;
const ARRIVE = 1.25, LEAVE = 0.55;
function draw(t) {
  const a = E.outCubic(t / ARRIVE);
  let ry = (1 - E.outBack(t / ARRIVE)) * -Math.PI * 1.5;
  let rx = (1 - a) * 0.5;
  let z = -34 * (1 - a), y = 0, s = 1;
  const hold = Math.max(0, t - ARRIVE), holdLen = Math.max(0.1, D - ARRIVE - LEAVE);
  if (TB.spin) ry += Math.PI * 2 * E.inOut(Math.min(1, hold / holdLen));
  else ry += Math.sin(hold * 1.5) * 0.22 * Math.min(1, hold * 2);
  rx += Math.sin(hold * 1.1) * 0.06;
  y += Math.sin(hold * 1.3) * 0.08;
  const out = Math.max(0, t - (D - LEAVE)) / LEAVE;
  if (out > 0) { const o = E.inCubic(out); ry += o * Math.PI; s = 1 - o; y += o * 1.5; }
  group.rotation.set(rx, ry, 0);
  group.position.set(0, y, z);
  group.scale.setScalar(k * Math.max(0.0001, s));
  sweep.position.set(-9 + 18 * (t / D), 2.5, 6);
  R.render(scene, cam);
}
const st = { t: 0 };
const tl = gsap.timeline({ paused: true });
tl.to(st, { t: D, duration: D, ease: "none", onUpdate: () => draw(st.t) }, 0);
window.addEventListener("hf-seek", (e) => { st.t = e.detail.time; draw(st.t); });
draw(0);
window.__timelines["main"] = tl;
</script>
</body></html>
