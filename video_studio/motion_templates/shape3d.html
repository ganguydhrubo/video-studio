<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width={{W}}, height={{H}}">
{{HEAD}}
<style>
html, body { margin: 0; background: transparent; }
#root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: transparent; }
.clip { position: absolute; inset: 0; }
canvas { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.4)); }
.neon canvas { filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 30px var(--glow2)); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}" data-fps="{{FPS}}">
  <section class="clip" id="scene" data-start="0" data-duration="{{DUR}}" data-track-index="0">
    <canvas id="c3" width="{{W}}" height="{{H}}"></canvas>
  </section>
</div>
<script>
/* Simple 3D objects made in code (no model files): gem, cube, ring, knot, star, heart, ball, diamond.
   They pop in, spin and float, then shrink away. */
const D = {{DUR}}, W = {{W}}, H = {{H}};
document.getElementById("scene").classList.add(TB.style);
const R = new THREE.WebGLRenderer({ canvas: document.getElementById("c3"), alpha: true, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1);
R.setSize(W, H, false);
R.setClearColor(0x000000, 0);
R.outputColorSpace = THREE.SRGBColorSpace;
R.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
cam.position.set(0, 0, 9);
const C = TB.colors;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.8); key.position.set(3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(new THREE.Color(C.accent2 || "#ff4d6d"), 2.0); rim.position.set(-4, -1, -3); scene.add(rim);

function extrude(shape, depth) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 4, curveSegments: 24 });
  g.center();
  return g;
}
function star() {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1.05, a = (i / 10) * Math.PI * 2 + Math.PI / 2;
    i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  return extrude(s, 0.35);
}
function heart() {
  const s = new THREE.Shape();
  s.moveTo(0, -0.95);
  s.bezierCurveTo(-0.35, -0.6, -1.1, -0.2, -1.1, 0.3);
  s.bezierCurveTo(-1.1, 0.85, -0.45, 1.05, 0, 0.6);
  s.bezierCurveTo(0.45, 1.05, 1.1, 0.85, 1.1, 0.3);
  s.bezierCurveTo(1.1, -0.2, 0.35, -0.6, 0, -0.95);
  return extrude(s, 0.45);
}
const GEO = {
  gem: () => new THREE.IcosahedronGeometry(1.05, 0),
  diamond: () => new THREE.OctahedronGeometry(1.1, 0),
  cube: () => new THREE.BoxGeometry(1.35, 1.35, 1.35),
  ring: () => new THREE.TorusGeometry(0.85, 0.3, 32, 96),
  knot: () => new THREE.TorusKnotGeometry(0.72, 0.25, 180, 24),
  ball: () => new THREE.SphereGeometry(1.0, 48, 32),
  star, heart,
};
const COLOUR = { heart: "#ff3b6b", star: "#ffc83d", gem: "#5ee7ff", diamond: "#bff4ff", cube: C.accent || "#ff7a3d",
  ring: "#ffd36b", knot: C.accent || "#7b61ff", ball: C.accent || "#ff7a3d" };
const shapeName = GEO[TB.shape] ? TB.shape : "gem";
const flat = ["gem", "diamond", "cube"].includes(shapeName);
const mat = new THREE.MeshStandardMaterial({ color: TB.style === "neon" ? "#ffffff" : COLOUR[shapeName], metalness: flat ? 0.35 : 0.55,
  roughness: flat ? 0.18 : 0.28, flatShading: flat });
if (TB.style === "neon") { mat.emissive = new THREE.Color(C.glow || "#22e6ff"); mat.emissiveIntensity = 0.6; }
const count = Math.max(1, Math.min(3, TB.count || 1));
const items = [];
for (let i = 0; i < count; i++) {
  const m = new THREE.Mesh(GEO[shapeName](), mat);
  const ang = (i / count) * Math.PI * 2;
  m.userData = { ang, r: count > 1 ? 1.25 : 0, s: count > 1 ? 0.55 : 1, phase: i * 1.7 };
  scene.add(m);
  items.push(m);
}
const E = TB.ease;
function draw(t) {
  const inn = E.outBack(t / 0.6), out = E.inCubic(Math.max(0, t - (D - 0.45)) / 0.45);
  items.forEach((m) => {
    const u = m.userData, a = u.ang + t * 0.9;
    m.position.set(Math.cos(a) * u.r, Math.sin(t * 1.6 + u.phase) * 0.18 + Math.sin(a) * u.r * 0.35, Math.sin(a) * u.r * 0.6);
    m.rotation.set(0.35 + t * 0.7 + u.phase, t * 1.9 + u.phase, t * 0.25);
    m.scale.setScalar(Math.max(0.0001, u.s * inn * (1 - out)));
  });
  R.render(scene, cam);
}
const st = { t: 0 };
const tl = gsap.timeline({ paused: true });
tl.to(st, { t: D, duration: D, ease: "none", onUpdate: () => draw(st.t) }, 0);
window.addEventListener("hf-seek", (e) => { st.t = e.detail.time; draw(st.t); });
draw(0);
window.__timelines["main"] = tl;
</script>
</body></html>
