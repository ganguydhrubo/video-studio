name: Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install "pillow>=10" "numpy>=1.26"
      - run: python -m unittest discover -s tests -v
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Verify release version
        shell: pwsh
        run: |
          $version = python -c "from video_studio import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and app version differ' }
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Test packaged app
        run: python packaging/smoke.py dist/VideoStudio/video-studio.exe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Windows-installer
          path: |
            dist/VideoStudio-Setup-*.exe
            dist/VideoStudio-*-portable.zip
            dist/SHA256SUMS.txt
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $notesPath = "docs/releases/$version.md"
          if (Test-Path $notesPath) {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Video Studio $version" --notes-file $notesPath
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Video Studio $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
